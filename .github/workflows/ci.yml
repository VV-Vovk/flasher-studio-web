name: Flasher Studio Web CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build browser vendor bundle
        run: npm run vendor && test -s public/usb-vendor.js
      - name: JavaScript tests
        run: npm test
      - name: Python tests
        run: python -m unittest discover -s tests -p '*_test.py'
      - uses: actions/upload-artifact@v6
        with:
          name: flasher-studio-web-${{ github.sha }}
          path: public/
          if-no-files-found: error
          retention-days: 7
