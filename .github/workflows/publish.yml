name: Publish Flasher Studio to Firebase
on:
  # One-time authorized release; all later releases still require manual confirmation.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_live:
        description: 'Publish tested main branch to the live Flasher Studio site'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: flasher-studio-firebase-live
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirm_live) ||
       (github.event_name == 'push' && github.event.before == '7a08d7e35fc62fc236ec2e7a989928b9d82ddc8b' &&
        github.event.head_commit.message == 'Release Flasher Studio v0.2.66 local firmware catalog'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run vendor && test -s public/usb-vendor.js && test -s public/licenses/npm-THIRD-PARTY-NOTICES.txt
      - name: Fetch and verify reviewed public STM32 package
        run: python tools/prepare_public_boot.py
      - run: npm test
      - run: python -m unittest discover -s tests -p '*_test.py'
      - uses: actions/upload-artifact@v6
        with:
          name: flasher-studio-release-${{ github.sha }}
          path: public/
          if-no-files-found: error
          retention-days: 7
      - name: Deploy only Flasher Studio Hosting target
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FLASHER_STUDIO_FIREBASE_SERVICE_ACCOUNT }}
          projectId: esp-flasher-byvovk
          target: studio
          channelId: live
